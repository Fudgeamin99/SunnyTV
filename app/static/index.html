<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-size:16px;color:#1e3a5f;background:linear-gradient(#cfeaff 0,#eef8ff 240px,#f6fbff 100%) fixed}
.app{display:flex;min-height:100vh;border-bottom:16px solid #6cc04a}
.side{width:210px;flex:none;background:#fff;border-right:6px solid;border-image:linear-gradient(180deg,#f25c54,#f7a541,#ffd23f,#6cc04a,#4aa3df,#9b7fd1) 1;padding:24px 16px;display:flex;flex-direction:column;gap:8px}
.mark{border:3px solid #1e3a5f;border-radius:16px;overflow:hidden;line-height:0;margin-bottom:8px}.mark svg{width:100%;height:auto}
.tg{font-size:13px;color:#4a6785;margin-bottom:16px}
.nav{padding:12px 16px;border-radius:999px;font-size:16px;font-weight:700;color:#35557a;cursor:pointer;background:none;border:0;text-align:left;font-family:inherit}
.nav:hover{background:#eef8ff}
.nav.on{background:#ffd23f;color:#1e3a5f}
.main{flex:1;padding:32px;display:flex;flex-direction:column;gap:20px;min-width:0}
.h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-family:Fredoka,sans-serif;font-weight:600;font-size:32px}
h2{margin:0;font-family:Fredoka,sans-serif;font-weight:500;font-size:19px}
.btn{border:2px solid #1e3a5f;background:#fff;color:#1e3a5f;padding:10px 22px;font:800 15px Nunito,sans-serif;min-height:44px;border-radius:999px;cursor:pointer}
.btn:hover{background:#fff7d1}.btn.p{background:#ffd23f}.btn.danger{border-color:#b3261e;color:#b3261e}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:16px;border:2px solid #bcd9ee;border-radius:16px;background:#fff;padding:10px 16px;min-height:60px;flex-wrap:wrap}
.row.sel{background:#fff3b8;border-color:#f7a541}
.row.click{cursor:pointer}
.lbl{font-size:14px;font-weight:700;color:#35557a;display:flex;flex-direction:column;gap:6px}
.fld{border:2px solid #7fb4dc;border-radius:12px;padding:10px 12px;min-height:44px;font:600 15px Nunito,sans-serif;width:100%;background:#fff;color:#1e3a5f}
.tag{border:2px solid #2f7a1f;color:#2f7a1f;background:#e5f6dc;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.sw{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:800;font-size:13px;color:#35557a;user-select:none}
.sw input{position:absolute;left:0;top:0;width:44px;height:26px;margin:0;opacity:0;cursor:pointer}
.sw .knob{width:44px;height:26px;border-radius:999px;background:#7b93ab;position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked + .knob{background:#2f7a1f}
.sw input:checked + .knob::after{left:21px}
.sw input:focus-visible + .knob{outline:3px solid #1e3a5f;outline-offset:2px}
.sw input:disabled{cursor:default}.sw input:disabled + .knob{opacity:.45}
.row.off{opacity:.65}
.tag.idle{border-color:#6a7f96;color:#4a6785;background:#eef3f8}
.tag.err{border-color:#b3261e;color:#b3261e;background:#fdecea}
.sub{color:#4a6785;font-size:13px;font-weight:600}
.grow{flex:1;min-width:0}
.cols{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.card{border:2px solid #bcd9ee;border-radius:20px;background:linear-gradient(90deg,#f25c54,#f7a541,#ffd23f,#6cc04a,#4aa3df,#9b7fd1) top/100% 8px no-repeat #fff;padding:28px 20px 20px;display:flex;flex-direction:column;gap:14px}
.scroll{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.gridwrap{overflow-x:auto}
.grid{position:relative;min-width:900px}
.grid .line{display:flex;gap:6px;margin-bottom:6px;align-items:stretch}
.grid .name{width:170px;flex:none;border:2px solid #bcd9ee;background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;min-height:52px;display:flex;align-items:center;cursor:pointer}
.grid .track{position:relative;flex:1;height:52px}
.blk{position:absolute;top:0;bottom:0;border:2px solid #bcd9ee;border-radius:10px;background:#e6f3fc;padding:6px 8px;font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.blk.now{background:#fff3b8;border-color:#f7a541}
.brk{position:absolute;left:0;bottom:0;height:8px;background:repeating-linear-gradient(45deg,#f7a541 0 4px,#ffd23f 4px 8px);border-radius:4px}
.bt{position:relative;z-index:1}
.tick{position:absolute;top:0;font-size:12px;font-weight:700;color:#4a6785;border-left:2px solid #bcd9ee;padding-left:4px;height:100%}
video{width:100%;max-height:380px;background:#000;border-radius:12px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e3a5f;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:9}
@media(max-width:760px){.app{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0}.mark{width:120px}.main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="mark"><svg viewBox="0 0 168 120" role="img" aria-label="Sunny TV logo"><rect width="168" height="120" fill="#bfe3fb"/><line x1="52.0" y1="30.0" x2="58.0" y2="30.0" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="47.3" y1="41.3" x2="51.6" y2="45.6" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="36.0" y1="46.0" x2="36.0" y2="52.0" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="24.7" y1="41.3" x2="20.4" y2="45.6" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="20.0" y1="30.0" x2="14.0" y2="30.0" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="24.7" y1="18.7" x2="20.4" y2="14.4" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="36.0" y1="14.0" x2="36.0" y2="8.0" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><line x1="47.3" y1="18.7" x2="51.6" y2="14.4" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><circle cx="36" cy="30" r="12" fill="#ffd23f"/><path d="M56 86A56 56 0 0 1 168 86" fill="none" stroke="#f25c54" stroke-width="6"/><path d="M62 86A50 50 0 0 1 162 86" fill="none" stroke="#f7a541" stroke-width="6"/><path d="M68 86A44 44 0 0 1 156 86" fill="none" stroke="#ffd23f" stroke-width="6"/><path d="M74 86A38 38 0 0 1 150 86" fill="none" stroke="#6cc04a" stroke-width="6"/><path d="M80 86A32 32 0 0 1 144 86" fill="none" stroke="#4aa3df" stroke-width="6"/><path d="M86 86A26 26 0 0 1 138 86" fill="none" stroke="#9b7fd1" stroke-width="6"/><path d="M0 84Q40 66 84 82T168 80V120H0Z" fill="#6cc04a"/><g fill="#fff"><circle cx="96" cy="62" r="12"/><circle cx="110" cy="56" r="15"/><circle cx="124" cy="63" r="12"/><rect x="92" y="62" width="36" height="13" rx="6"/></g><g fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"><path d="M101 62q3-4 6 0"/><path d="M113 62q3-4 6 0"/></g><path d="M104 67q6 9 12 0z" fill="#1e3a5f"/><g fill="#4aa3df"><ellipse cx="100" cy="68" rx="1.8" ry="3"/><ellipse cx="120" cy="68" rx="1.8" ry="3"/></g><rect y="94" width="168" height="26" fill="#ffd23f"/><rect y="94" width="168" height="2" fill="#1e3a5f"/><text x="84" y="113" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="19" fill="#1e3a5f">Sunny TV</text></svg></div>
<div class="tg">always on, always bright</div>
<button class="nav" data-nav="channels">Channels</button>
<button class="nav" data-nav="library">Library</button>
<button class="nav" data-nav="adverts">Adverts</button>
<button class="nav" data-nav="guide">Guide</button>
<button class="nav" data-nav="settings">Settings</button>
</aside>
<main class="main" id="main"></main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method, url, body) {
  const r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    throw new Error(m);
  }
  return r.json();
}
const fmt = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(x).padStart(2, '0')}s` : `${x}s`; };
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }

const S = {view: 'channels', timer: null, hls: null};
function clearTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } if (S.hls) { S.hls.destroy(); S.hls = null; } }
async function go(view, arg) {
  clearTimer();
  S.view = view;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.nav === (view === 'editor' ? 'channels' : view)));
  try {
    if (view === 'channels') await viewChannels();
    else if (view === 'editor') await viewEditor(arg);
    else if (view === 'library') await viewLibrary(arg || '');
    else if (view === 'adverts') await viewAdverts();
    else if (view === 'guide') await viewGuide();
    else if (view === 'settings') await viewSettings();
  } catch (e) { $('#main').innerHTML = `<div class="card"><h2>Something went wrong</h2><div class="sub">${esc(e.message)}</div></div>`; }
}

/* ---------- Channels ---------- */
async function viewChannels() {
  const [chs, groups, info] = await Promise.all([api('GET', '/api/channels'), api('GET', '/api/ad-groups'), api('GET', '/api/info')]);
  const gname = id => (groups.find(g => g.id === id) || {}).name || 'None';
  const rows = chs.map(c => {
    const now = c.now ? (c.now.kind === 'ad' ? 'Ad break' : esc(c.now.title)) : (c.videos ? 'Starting...' : (c.source.type === 'youtube' ? esc(c.sync_status || 'waiting for sync') : 'No videos found yet'));
    const tag = !c.enabled ? ['idle', 'Off'] : c.live ? ['', c.always_on ? 'Live 24/7' : 'Live'] : c.always_on ? ['', 'Starting'] : ['idle', 'Idle'];
    const sw = (flag, label, on, tip, disabled) => `<label class="sw" title="${tip}"><input type="checkbox" role="switch" data-flag="${flag}" data-id="${c.id}" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''} aria-label="${label} for ${esc(c.name)}"><span class="knob"></span>${label}</label>`;
    return `<div class="row ${c.enabled ? '' : 'off'}"><b style="width:36px">${c.number}</b><div class="grow"><b>${esc(c.name)}</b><div class="sub">Now: ${now}</div></div>
      <div class="sub" style="width:110px">${c.videos} videos</div><div class="sub" style="width:170px">Ads: ${esc(gname(c.ad_group_id))}</div>
      ${sw('enabled', 'On', c.enabled, 'Turn this channel on or off. Off channels are hidden from Plex, the guide and the playlists.', false)}
      ${sw('always_on', '24/7', c.always_on, 'Keep this channel running all the time, even when nobody is watching.', !c.enabled)}
      <span class="tag ${tag[0]}" style="min-width:74px;text-align:center">${tag[1]}</span>
      <button class="btn" data-act="edit" data-id="${c.id}">Edit</button></div>`;
  }).join('') || '<div class="sub">No channels yet. Create one to get started.</div>';
  const link = (label, url) => `<label class="lbl grow" style="min-width:260px">${label}<div style="display:flex;gap:8px"><input class="fld" readonly value="${esc(url)}"><button class="btn" data-act="copy" data-text="${esc(url)}">Copy</button></div></label>`;
  $('#main').innerHTML = `<div class="h"><h1>Channels</h1><button class="btn p" data-act="edit" data-id="new">New channel</button></div>${rows}
    <div class="card"><h2>Tuner links</h2><div class="cols">${link('M3U playlist (HLS)', info.m3u)}${link('M3U playlist (MPEG-TS, for Plex)', info.m3u_ts)}${link('XMLTV guide', info.xmltv)}${link('Plex / Jellyfin tuner address (add as an HDHomeRun device)', info.hdhr)}</div>
    <div class="sub">Channels with 24/7 off only start encoding when someone tunes in, and stop shortly after the last viewer leaves. 24/7 channels encode all the time, which uses more of the NAS. Turning a channel Off hides it from Plex and the playlists (rescan the tuner in Plex to drop it there).</div></div>`;
  S.timer = setInterval(() => { if (S.view === 'channels') viewChannels(); }, 15000);
}

/* ---------- Channel editor ---------- */
async function viewEditor(id) {
  const isNew = id === 'new';
  const [groups, dirs, chs] = await Promise.all([api('GET', '/api/ad-groups'), api('GET', '/api/library/dirs'), api('GET', '/api/channels')]);
  const c = isNew ? {number: Math.max(0, ...chs.map(x => x.number)) + 1, name: '', source: {type: 'youtube', folder: '', url: '', keep: 15, refresh_hours: 6, quality: 1080, subtitles: false, sub_lang: 'en'}, order: 'sequential', ad_group_id: null, ad_break_seconds: 60, ad_break_every: 15} : chs.find(x => x.id === id);
  if (!c) throw new Error('Channel not found');
  const s = c.source;
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
  $('#main').innerHTML = `<div class="h"><h1>${isNew ? 'New channel' : 'Edit channel'}</h1><div class="cols" style="gap:12px">
    <button class="btn" data-act="cancel">Cancel</button>${isNew ? '' : '<button class="btn danger" data-act="delete" data-id="' + c.id + '">Delete</button>'}
    <button class="btn p" data-act="save" data-id="${isNew ? 'new' : c.id}">Save</button></div></div>
  <div class="cols"><div class="card" style="width:340px">
    <label class="lbl">Channel number<input class="fld" id="f-number" type="number" min="1" value="${c.number}"></label>
    <label class="lbl">Name<input class="fld" id="f-name" value="${esc(c.name)}"></label>
    <label class="lbl">Playback order<select class="fld" id="f-order">${opt('sequential', 'Sequential', c.order)}${opt('shuffle', 'Shuffle (fixed order per channel)', c.order)}</select></label>
    <label class="lbl">Advert group<select class="fld" id="f-ad"><option value="">None</option>${groups.map(g => opt(g.id, esc(g.name), c.ad_group_id)).join('')}</select></label>
    <label class="lbl">Ad break every<select class="fld" id="f-every">${[[0, 'Only between videos'], [10, '10 minutes'], [15, '15 minutes'], [20, '20 minutes'], [30, '30 minutes']].map(([v, l]) => opt(v, l, c.ad_break_every ?? 15)).join('')}</select></label>
    <label class="lbl">Ad break length<select class="fld" id="f-pod">${[[0, 'No ads'], [30, '30 seconds'], [60, '1 minute'], [90, '90 seconds'], [120, '2 minutes']].map(([v, l]) => opt(v, l, c.ad_break_seconds)).join('')}</select></label>
    <div class="sub" id="ad-hint" aria-live="polite"></div>
  </div>
  <div class="card grow" style="min-width:320px"><div class="h"><h2>Source</h2><span class="sub" id="sync-line"></span></div>
    <label class="lbl">Source type<select class="fld" id="f-type">${opt('youtube', 'YouTube channel', s.type)}${opt('folder', 'My own videos (from the media folder)', s.type)}</select></label>
    <div id="src-yt" class="cols" style="gap:16px">
      <label class="lbl grow" style="flex:2;min-width:240px">Channel URL<input class="fld" id="f-url" placeholder="https://www.youtube.com/@yourchannel" value="${esc(s.url)}"></label>
      <label class="lbl grow" style="min-width:110px">Keep latest<input class="fld" id="f-keep" type="number" min="1" max="100" value="${s.keep}"></label>
      <label class="lbl grow" style="min-width:130px">Refresh every<select class="fld" id="f-refresh">${[[1, '1 hour'], [6, '6 hours'], [24, '24 hours']].map(([v, l]) => opt(v, l, s.refresh_hours)).join('')}</select></label>
      <label class="lbl grow" style="min-width:110px">Max quality<select class="fld" id="f-quality">${[480, 720, 1080, 1440].map(v => opt(v, v + 'p', s.quality)).join('')}</select></label>
      <label class="lbl grow" style="min-width:150px">Subtitles<select class="fld" id="f-subs">${opt('0', 'Off', s.subtitles ? '1' : '0')}${opt('1', 'On (burned into the picture)', s.subtitles ? '1' : '0')}</select></label>
      <label class="lbl grow" style="min-width:110px">Language<input class="fld" id="f-sublang" maxlength="12" value="${esc(s.sub_lang || 'en')}" placeholder="en"></label>
      <div class="sub" style="width:100%">Subtitles use the video's own captions when it has them, otherwise YouTube's automatic ones. Videos without any play without subtitles.</div>
      <div class="sub" style="width:100%">Downloaded with yt-dlp. Older videos drop off the loop. Use only content you own or have permission to broadcast.</div>
    </div>
    <div id="src-folder"><label class="lbl">Which videos<select class="fld" id="f-folder"><option value="">Everything in the media folder</option>${[...new Set([...dirs, ...(s.folder && !dirs.includes(s.folder) ? [s.folder] : [])])].map(d => opt(d, esc(d), s.folder)).join('')}</select></label>
      <div class="sub" style="margin-top:6px">Plays your own videos from the media folder you mounted. Put videos in sub folders to make separate channels, one per folder.</div></div>
    <div class="h"><h2>Playlist</h2>${isNew ? '' : '<button class="btn" data-act="sync" data-id="' + c.id + '" id="sync-btn">Sync now</button>'}</div>
    <div id="pl" class="scroll"><div class="sub">${isNew ? 'Save the channel to see its playlist.' : 'Loading...'}</div></div>
  </div></div>`;
  S.editNew = isNew; S.libFiles = null; S.groups = groups;
  toggleSource();
  adHint();
  if (isNew) previewFolder();
  if (!isNew) { refreshPlaylist(c.id); S.timer = setInterval(() => refreshPlaylist(c.id), 4000); }
}
function adHint() {
  const el = $('#ad-hint'); if (!el) return;
  const gid = $('#f-ad').value, pod = parseInt($('#f-pod').value, 10), every = parseInt($('#f-every').value, 10);
  const g = (S.groups || []).find(x => x.id === gid);
  const len = pod >= 60 && pod % 60 === 0 ? `${pod / 60} minute` : `${pod} second`;
  if (!g) el.textContent = 'No advert group picked, so no ad breaks will play. Choose one above.';
  else if (!g.clips.length) el.textContent = `"${g.name}" has no adverts in it yet. Add some on the Adverts page.`;
  else if (!pod) el.textContent = 'Break length is set to No ads, so no breaks will play.';
  else el.textContent = `A ${len} break from "${g.name}" (${g.clips.length} adverts) plays ${every ? 'every ' + every + ' minutes and ' : ''}after each video. Changes apply to the running channel within a few seconds.`;
}
async function previewFolder() {
  if (!S.editNew || !$('#pl')) return;
  if ($('#f-type').value !== 'folder') { $('#pl').innerHTML = '<div class="sub">Save the channel to see its playlist.</div>'; return; }
  if (!S.libFiles) S.libFiles = await api('GET', '/api/library/files');
  const f = $('#f-folder').value;
  const list = S.libFiles.filter(x => !f || x.rel.startsWith(f + '/'));
  $('#pl').innerHTML = list.length
    ? '<div class="sub">These will play, in this order, once you save:</div>' + list.map((v, i) => `<div class="row"><b style="width:28px">${i + 1}</b><div class="grow">${esc(f ? v.rel.slice(f.length + 1) : v.rel)}</div><span class="sub">${v.duration ? fmt(v.duration) : ''}</span></div>`).join('')
    : '<div class="sub">No videos found there yet. Copy video files into the media folder you mapped in your compose file, then reopen this page.</div>';
}
function toggleSource() {
  const t = $('#f-type').value;
  $('#src-yt').style.display = t === 'youtube' ? '' : 'none';
  $('#src-folder').style.display = t === 'folder' ? '' : 'none';
  const b = $('#sync-btn'); if (b) b.style.display = t === 'youtube' ? '' : 'none';
}
async function refreshPlaylist(id) {
  if (!$('#pl')) return;
  try {
    const d = await api('GET', `/api/channels/${id}/items`);
    const sl = $('#sync-line');
    if (sl) sl.textContent = d.sync_status && d.sync_status !== 'never' ? `Sync: ${d.sync_status}${d.next_sync && d.sync_status.startsWith('ok') ? ', next ' + clock(d.next_sync) : ''}` : '';
    $('#pl').innerHTML = d.items.length ? d.items.map((v, i) => `<div class="row"><b style="width:28px">${i + 1}</b><div class="grow">${esc(v.title)}</div><span class="sub">${fmt(v.duration)}</span></div>`).join('') : `<div class="sub">${$('#f-type').value === 'folder' ? 'Scanning your videos, this can take a moment for large files...' : 'Nothing to play yet.'}</div>`;
  } catch (e) {}
}
function readForm() {
  const type = $('#f-type').value;
  return {
    number: parseInt($('#f-number').value, 10), name: $('#f-name').value.trim(), order: $('#f-order').value,
    ad_group_id: $('#f-ad').value || null, ad_break_seconds: parseInt($('#f-pod').value, 10), ad_break_every: parseInt($('#f-every').value, 10),
    source: {type, folder: $('#f-folder').value.trim(), url: $('#f-url').value.trim(), keep: parseInt($('#f-keep').value, 10) || 15,
             refresh_hours: parseFloat($('#f-refresh').value), quality: parseInt($('#f-quality').value, 10),
             subtitles: $('#f-subs').value === '1', sub_lang: ($('#f-sublang').value.trim() || 'en')},
  };
}

/* ---------- Library ---------- */
async function viewLibrary(path) {
  const d = await api('GET', '/api/library?path=' + encodeURIComponent(path));
  const parts = path ? path.split('/') : [];
  const root = path ? '<button class="btn" data-act="lib" data-path="">media</button>' : '<b>media</b>';
  const crumbs = [root].concat(parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p)}</b>` : `<button class="btn" data-act="lib" data-path="${esc(parts.slice(0, i + 1).join('/'))}">${esc(p)}</button>`)).join(' / ');
  const dirs = d.dirs.map(n => `<div class="row click" data-act="lib" data-path="${esc((path ? path + '/' : '') + n)}"><b>${esc(n)}</b><span class="sub">folder</span></div>`).join('');
  const files = d.files.map(f => `<div class="row"><div class="grow">${esc(f.name)}</div><span class="sub">${f.duration ? fmt(f.duration) : 'scanning...'}</span></div>`).join('');
  let note = '';
  if (!d.mounted) note = `<div class="card"><h2>The media folder is not connected</h2><div class="sub">Nothing is mounted at <b>${esc(d.root)}</b> inside the container. In your compose file, the line ending in <b>:/media:ro</b> must point to a folder that exists on your NAS. You can ignore this if you only use YouTube channels.</div></div>`;
  else if (!dirs && !files) note = `<div class="card"><h2>No videos here yet</h2><div class="sub">The media folder is connected but has no video files${path ? ' in this folder' : ''}. Copy video files (mp4, mkv, avi, mov, vob, ts and most other formats) into the folder you mapped to <b>${esc(d.root)}</b>, then refresh. This page only shows your own videos. YouTube downloads are not listed here.</div></div>`;
  $('#main').innerHTML = `<div class="h"><h1>Library</h1><button class="btn" data-act="lib" data-path="${esc(path)}">Refresh</button></div><div class="cols" style="gap:8px;align-items:center">${crumbs}</div>${note}${dirs}${files}`;
}

/* ---------- Adverts ---------- */
const A = {groups: [], channels: [], lib: [], sel: null, adding: false, q: ''};
async function viewAdverts() {
  [A.groups, A.channels, A.lib] = await Promise.all([api('GET', '/api/ad-groups'), api('GET', '/api/channels'), api('GET', '/api/library/files')]);
  A.adding = false; A.q = '';
  pickGroup(A.sel && A.groups.find(g => g.id === A.sel.id) ? A.sel.id : (A.groups[0] ? A.groups[0].id : null));
}
function pickGroup(id) {
  const g = A.groups.find(x => x.id === id);
  A.sel = g ? {id: g.id, name: g.name, clips: [...g.clips], channel_ids: A.channels.filter(c => c.ad_group_id === g.id).map(c => c.id)} : null;
  renderAdverts();
}
function renderAdverts() {
  const dur = rel => { const f = A.lib.find(x => x.rel === rel); return f && f.duration ? fmt(f.duration) : ''; };
  const list = A.groups.map(g => `<div class="row click ${A.sel && A.sel.id === g.id ? 'sel' : ''}" data-act="pick-group" data-id="${g.id}"><div class="grow"><b>${esc(g.name)}</b><div class="sub">${g.clips.length} ads</div></div></div>`).join('') || '<div class="sub">No groups yet.</div>';
  let right = '<div class="card grow"><div class="sub">Create a group to start.</div></div>';
  if (A.sel) {
    const s = A.sel;
    const avail = A.lib.filter(f => !s.clips.includes(f.rel) && f.rel.toLowerCase().includes(A.q.toLowerCase()));
    const picker = A.adding ? `<div class="card" style="border-color:#f7a541"><input class="fld" id="adq" placeholder="Filter library..." value="${esc(A.q)}">
      <div class="scroll">${avail.slice(0, 300).map(f => `<label class="row" style="min-height:44px"><input type="checkbox" class="pick" value="${esc(f.rel)}" style="width:20px;height:20px;accent-color:#f7a541"><span class="grow">${esc(f.rel)}</span><span class="sub">${f.duration ? fmt(f.duration) : ''}</span></label>`).join('') || '<div class="sub">No matching files.</div>'}</div>
      <div><button class="btn p" data-act="add-picked">Add selected</button> <button class="btn" data-act="toggle-add">Close</button></div></div>` : '';
    right = `<div class="card grow" style="min-width:320px"><label class="lbl">Group name<input class="fld" id="g-name" value="${esc(s.name)}"></label>
      <div class="h"><h2>Adverts in group</h2><button class="btn" data-act="toggle-add">Add adverts</button></div>${picker}
      ${s.clips.map((r, i) => `<div class="row"><b style="width:24px">${i + 1}</b><div class="grow">${esc(r)}</div><span class="sub">${dur(r) || 'checking...'}</span><button class="btn" data-act="rm-clip" data-i="${i}" aria-label="Remove">Remove</button></div>`).join('') || '<div class="sub">No adverts yet. Put ad clips in your media folder, then add them here.</div>'}
      <h2>Apply to channels</h2><div class="cols" style="gap:12px">${A.channels.map(c => `<label class="row" style="flex:1;min-width:200px;gap:12px"><input type="checkbox" class="chk" value="${c.id}" ${s.channel_ids.includes(c.id) ? 'checked' : ''} style="width:22px;height:22px;accent-color:#f7a541">${c.number} ${esc(c.name)}</label>`).join('') || '<div class="sub">No channels yet.</div>'}</div>
      <div class="sub">Each channel sets how often a break plays (for example every 15 minutes, and after each video) and how long it lasts. Ads rotate through the group.</div>
      <div class="cols" style="gap:12px"><button class="btn p" data-act="save-group">Save group</button><button class="btn danger" data-act="del-group">Delete group</button></div></div>`;
  }
  $('#main').innerHTML = `<div class="h"><h1>Adverts</h1><button class="btn p" data-act="new-group">New group</button></div><div class="cols"><div class="card" style="width:290px"><h2>Groups</h2>${list}</div>${right}</div>`;
}

/* ---------- Guide ---------- */
const G = {data: null, t0: 0, win: 6};
const dayLabel = t => new Date(t * 1000).toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'});
function dayStart(offset) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d.getTime() / 1000; }
function clampWindow() {
  const first = Math.floor(G.data.now / 1800) * 1800, last = G.data.now + 168 * 3600 - G.win * 3600;
  G.t0 = Math.max(first, Math.min(G.t0, last));
}
function guideGrid() {
  const g = G.data, W = G.win * 3600, t0 = G.t0, t1 = t0 + W;
  const pct = t => ((t - t0) / W * 100);
  const step = G.win <= 6 ? 1800 : G.win <= 12 ? 3600 : 7200;
  let ticks = '';
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) {
    const d = new Date(t * 1000), mid = d.getHours() === 0 && d.getMinutes() === 0;
    ticks += `<div class="tick" style="left:${pct(t)}%">${mid ? dayLabel(t) + ' ' : ''}${clock(t)}</div>`;
  }
  const rows = g.channels.map(c => {
    const blocks = c.programmes.map(p => {
      const a = Math.max(p.start, t0), b = Math.min(p.stop, t1);
      if (b <= a) return '';
      const now = p.start <= g.now && p.stop > g.now;
      const brk = (p.breaks || []).map(([bs, be]) => {
        const x = Math.max(bs, a), y = Math.min(be, b);
        return y <= x ? '' : `<span class="brk" title="Ad break ${clock(bs)} to ${clock(be)}" style="left:${(x - a) / (b - a) * 100}%;width:${Math.max((y - x) / (b - a) * 100, 0.6)}%"></span>`;
      }).join('');
      return `<div class="blk ${now ? 'now' : ''}" title="${esc(p.title)} (${clock(p.start)} to ${clock(p.stop)})" style="left:${pct(a)}%;width:${(b - a) / W * 100}%"><span class="bt">${esc(p.title)}</span>${brk}</div>`;
    }).join('');
    return `<div class="line"><div class="name" data-act="watch" data-num="${c.number}" data-name="${esc(c.name)}">${c.number} ${esc(c.name)}</div><div class="track">${blocks}</div></div>`;
  }).join('') || '<div class="sub">No channels yet.</div>';
  return `<div class="grid"><div class="line"><div class="sub" style="width:170px;flex:none;align-self:center">${dayLabel(t0)}</div><div class="track" style="height:22px">${ticks}</div></div>${rows}</div>`;
}
function upNext() {
  const g = G.data, tm = t => `${clock(t)}`;
  const mins = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60 ? m % 60 + 'm' : ''}`.trim() : `${m}m`; };
  return g.channels.map(c => {
    const list = c.programmes.filter(p => p.stop > g.now).slice(0, 10);
    const rows = list.map((p, i) => {
      const now = p.start <= g.now;
      const nb = (p.breaks || []).filter(b => b[1] > g.now).length;
      const when = now ? `Now, until ${tm(p.stop)}` : `${i === 1 ? 'Next ' : ''}${tm(p.start)}`;
      return `<div class="row" style="min-height:40px;${now ? 'background:#fff3c4;border-radius:10px' : ''}"><b style="width:150px;flex:none">${when}</b><div class="grow">${p.ad ? 'Ad break' : esc(p.title)}</div><span class="sub">${mins(p.stop - p.start)}${nb ? ` · ${nb} ad break${nb > 1 ? 's' : ''}` : ''}</span></div>`;
    }).join('') || '<div class="sub">Nothing scheduled.</div>';
    return `<div class="card" style="flex:1;min-width:340px"><h2>${c.number} ${esc(c.name)}: coming up</h2>${rows}</div>`;
  }).join('');
}
function renderGuide() {
  const el = $('#guide-grid');
  if (el && G.data) {
    clampWindow(); el.innerHTML = guideGrid(); $('#g-updated').textContent = 'Updated ' + clock(G.data.now);
    const u = $('#up-next'); if (u) u.innerHTML = upNext();
  }
}
async function refreshGuide(quiet) {
  const btn = $('#g-refresh');
  if (btn && !quiet) btn.disabled = true;
  try {
    G.data = await api('GET', '/api/guide?hours=168');
    renderGuide();
    if (!quiet) toast('Guide refreshed');
  } catch (e) { if (!quiet) toast(e.message); }
  finally { if (btn) btn.disabled = false; }
}
async function viewGuide() {
  G.data = await api('GET', '/api/guide?hours=168');
  G.t0 = Math.floor(G.data.now / 1800) * 1800;
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => `<option value="${i}">${i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : new Date(dayStart(i) * 1000).toLocaleDateString([], {weekday: 'long'})}</option>`).join('');
  $('#main').innerHTML = `<div class="h"><h1>Guide</h1><div class="cols" style="gap:10px;align-items:center">
      <span class="sub" id="g-updated"></span>
      <button class="btn" data-act="g-earlier">Earlier</button><button class="btn" data-act="g-now">Now</button><button class="btn" data-act="g-later">Later</button>
      <select class="fld" id="g-day" style="width:auto" aria-label="Jump to day">${days}</select>
      <select class="fld" id="g-win" style="width:auto" aria-label="Hours shown"><option value="3">3 hours</option><option value="6" selected>6 hours</option><option value="12">12 hours</option><option value="24">24 hours</option></select>
      <button class="btn" data-act="guide-refresh" id="g-refresh">Refresh guide</button></div></div>
    <div class="card"><div class="h"><h2 id="pv-title">Preview</h2><span class="sub">Click a channel name below to watch. The stream can take about 10 seconds to start</span></div><video id="pv" controls muted playsinline></video></div>
    <div class="sub">The guide covers the next 7 days. The striped bar along the bottom of a programme marks its ad breaks.</div>
    <div class="gridwrap" id="guide-grid"></div>
    <h2 style="margin:18px 0 8px">Up next</h2><div class="cols" id="up-next" style="gap:14px;align-items:flex-start"></div>`;
  renderGuide();
  S.timer = setInterval(() => { if (S.view === 'guide') refreshGuide(true); }, 60000);
}
function watch(num, name) {
  const v = $('#pv'), url = `/stream/${num}/index.m3u8`;
  $('#pv-title').textContent = `${num} ${name}`;
  if (S.hls) { S.hls.destroy(); S.hls = null; }
  if (window.Hls && Hls.isSupported()) { S.hls = new Hls({liveSyncDurationCount: 3}); S.hls.loadSource(url); S.hls.attachMedia(v); }
  else v.src = url;
  v.play().catch(() => {});
  scrollTo({top: 0, behavior: 'smooth'});
}

/* ---------- Settings / updates ---------- */
async function viewSettings() {
  const [st, info] = await Promise.all([api('GET', '/api/update/status'), api('GET', '/api/info')]);
  const e = info.encoder;
  const encText = e.mode === 'vaapi' ? 'Hardware (GPU) encoding is on. The CPU stays free.'
    : e.requested !== 'vaapi' ? 'Using the CPU. To use your NAS graphics chip, set HWACCEL=vaapi and map /dev/dri in your compose file (see the README).'
    : e.device_found ? 'GPU encoding failed, so the CPU is being used. Check data/logs for the reason.'
    : `No GPU found at ${e.device}, so the CPU is being used. Add the devices line for /dev/dri to your compose file.`;
  $('#main').innerHTML = `<div class="h"><h1>Settings</h1></div>
    <div class="card"><h2>Video encoding</h2><div class="sub">${esc(encText)}</div></div>
    <div class="card"><h2>Updates</h2>
      <div class="sub">Pulls the latest app code from <b>${esc(st.repo)}</b> (branch ${esc(st.branch)}) on GitHub. Current version: <b>${esc(st.current)}</b></div>
      <div id="upd-msg" class="sub" aria-live="polite"></div>
      <div class="cols" style="gap:12px"><button class="btn" data-act="upd-check" id="upd-check">Check for updates</button>
        <button class="btn p" data-act="upd-apply" id="upd-apply" style="display:none">Update now</button></div>
      <div class="sub">Updating restarts the app for a few seconds, and open streams reconnect on their own. Changes to the Docker image itself (new Dockerfile or requirements) need a new image pulled on the NAS.</div>
    </div>`;
}
async function waitForRestart() {
  $('#upd-msg').textContent = 'Updated. Restarting...';
  await new Promise(r => setTimeout(r, 4000));
  for (let i = 0; i < 60; i++) {
    try { const r = await fetch('/api/info', {cache: 'no-store'}); if (r.ok) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 2000));
  }
  $('#upd-msg').textContent = 'The app did not come back. Check the container on your NAS.';
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]'); if (nav) return go(nav.dataset.nav);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  try {
    switch (d.act) {
      case 'edit': return go('editor', d.id);
      case 'cancel': return go('channels');
      case 'copy': await navigator.clipboard.writeText(d.text); return toast('Copied');
      case 'save': {
        const body = readForm();
        if (!body.name) return toast('Give the channel a name');
        if (body.source.type === 'youtube' && !body.source.url) return toast('Paste a YouTube channel URL');
        if (d.id === 'new') await api('POST', '/api/channels', body); else await api('PUT', '/api/channels/' + d.id, body);
        toast('Saved'); return go('channels');
      }
      case 'delete': if (!confirm('Delete this channel and its downloaded videos?')) return; await api('DELETE', '/api/channels/' + d.id); return go('channels');
      case 'sync': await api('POST', '/api/channels/' + d.id + '/sync'); toast('Sync started'); return refreshPlaylist(d.id);
      case 'upd-check': {
        const msg = $('#upd-msg'), apply = $('#upd-apply');
        msg.textContent = 'Checking GitHub...'; apply.style.display = 'none'; el.disabled = true;
        try {
          const r = await api('POST', '/api/update/check');
          const l = r.latest ? ` Latest change: "${r.latest.message}" (${r.latest.sha}).` : '';
          if (r.needs_rebuild) msg.textContent = 'A newer version exists, but it changes the Docker image. Pull the newest image on your NAS to get it.' + l;
          else if (r.available) { msg.textContent = 'An update is available.' + l; apply.style.display = ''; }
          else msg.textContent = 'You are up to date.' + l;
        } finally { el.disabled = false; }
        return;
      }
      case 'upd-apply': {
        if (!confirm('Install the update? The app will restart for a few seconds.')) return;
        el.disabled = true; $('#upd-msg').textContent = 'Downloading update...';
        try { await api('POST', '/api/update/apply'); } catch (err) { el.disabled = false; $('#upd-msg').textContent = err.message; return; }
        return waitForRestart();
      }
      case 'guide-refresh': return refreshGuide(false);
      case 'g-earlier': G.t0 -= G.win * 3600; return renderGuide();
      case 'g-later': G.t0 += G.win * 3600; return renderGuide();
      case 'g-now': G.t0 = Math.floor(G.data.now / 1800) * 1800; $('#g-day').value = '0'; return renderGuide();
      case 'lib': return go('library', d.path);
      case 'watch': return watch(d.num, d.name);
      case 'pick-group': return pickGroup(d.id);
      case 'new-group': { const g = await api('POST', '/api/ad-groups', {name: 'New group', clips: []}); A.groups.push(g); return pickGroup(g.id); }
      case 'toggle-add': A.adding = !A.adding; return renderAdverts();
      case 'add-picked': { document.querySelectorAll('.pick:checked').forEach(c => A.sel.clips.push(c.value)); A.adding = false; return renderAdverts(); }
      case 'rm-clip': A.sel.clips.splice(parseInt(d.i, 10), 1); return renderAdverts();
      case 'save-group': {
        const s = A.sel;
        await api('PUT', '/api/ad-groups/' + s.id, {name: s.name || 'Untitled', clips: s.clips});
        await api('PUT', `/api/ad-groups/${s.id}/channels`, {channel_ids: s.channel_ids});
        toast('Group saved'); return viewAdverts();
      }
      case 'del-group': if (!confirm('Delete this advert group?')) return; await api('DELETE', '/api/ad-groups/' + A.sel.id); A.sel = null; return viewAdverts();
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('change', async e => {
  const flag = e.target.dataset && e.target.dataset.flag;
  if (flag) {
    e.target.disabled = true;
    try { await api('PUT', `/api/channels/${e.target.dataset.id}/flags`, {[flag]: e.target.checked}); }
    catch (err) { toast(err.message); }
    return viewChannels();
  }
  if (e.target.id === 'f-type') { toggleSource(); previewFolder(); }
  if (e.target.id === 'g-win') { G.win = parseInt(e.target.value, 10); renderGuide(); }
  if (e.target.id === 'g-day') { const i = parseInt(e.target.value, 10); G.t0 = i === 0 ? Math.floor(G.data.now / 1800) * 1800 : dayStart(i); renderGuide(); }
  if (e.target.id === 'f-folder') previewFolder();
  if (['f-ad', 'f-pod', 'f-every'].includes(e.target.id)) adHint();
  if (e.target.classList.contains('chk') && A.sel) A.sel.channel_ids = [...document.querySelectorAll('.chk:checked')].map(c => c.value);
});
document.addEventListener('input', e => {
  if (e.target.id === 'g-name' && A.sel) A.sel.name = e.target.value;
  if (e.target.id === 'adq') { A.q = e.target.value; const pos = e.target.selectionStart; renderAdverts(); const q = $('#adq'); q.focus(); q.setSelectionRange(pos, pos); }
});
go('channels');
</script>
